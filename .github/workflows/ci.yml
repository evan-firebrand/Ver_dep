name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        id: typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        id: build
        run: npm run build
        continue-on-error: true

      - name: Compose CI summary
        id: summary
        uses: actions/github-script@v7
        with:
          script: |
            const lint = '${{ steps.lint.outcome }}';
            const typecheck = '${{ steps.typecheck.outcome }}';
            const build = '${{ steps.build.outcome }}';

            const icon = (s) => s === 'success' ? '✅' : '❌';
            const rows = [
              `| Lint | ${icon(lint)} ${lint} |`,
              `| Typecheck | ${icon(typecheck)} ${typecheck} |`,
              `| Build | ${icon(build)} ${build} |`,
            ].join('\n');

            const table = `| Check | Result |\n|---|---|\n${rows}`;

            const failed = [lint, typecheck, build].some(s => s !== 'success');

            let body;
            if (failed) {
              const failures = [];
              if (lint !== 'success') failures.push('`npm run lint`');
              if (typecheck !== 'success') failures.push('`npm run typecheck`');
              if (build !== 'success') failures.push('`npm run build`');
              body = `### Hey Claude —\n\nThe following checks failed: ${failures.join(', ')}. Fix the issues, commit, and push.\n\n${table}`;
            } else {
              body = `### ✅ All checks passed\n\n${table}`;
            }

            core.setOutput('body', body);
            core.setOutput('failed', failed.toString());

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-summary
          message: ${{ steps.summary.outputs.body }}

      - name: Fail if checks failed
        if: steps.summary.outputs.failed == 'true'
        run: exit 1
